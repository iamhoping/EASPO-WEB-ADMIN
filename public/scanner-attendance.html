<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EASPO - Attendance Scanner</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/scanner.css">
</head>
<body class="scanner-page-shell">
  <main id="scannerPage" class="scanner-page">
    <header class="scanner-topbar">
      <div><div class="scanner-brand">EASPO</div><div class="scanner-role">Attendance Scanner</div></div>
      <div class="scanner-account">
        <div><strong id="scannerAccountName">Scanner</strong><span id="scannerAccountEmail"></span></div>
        <button id="scannerLogout" class="scanner-logout" type="button">Sign out</button>
      </div>
    </header>
    <section class="scanner-workspace" aria-labelledby="scannerHeading">
      <div class="scanner-heading-row">
        <div>
          <p class="scanner-eyebrow">Attendance station</p>
          <h1 id="scannerHeading">Scan Student QR Code</h1>
          <p class="scanner-instruction">Connect the USB scanner and scan a student ID. The record is submitted automatically.</p>
        </div>
        <div class="scanner-ready-badge"><span class="scanner-indicator" id="scannerIndicator" aria-hidden="true"></span><span id="scannerStatus" role="status" aria-live="polite">Ready to Scan</span></div>
      </div>
      <div class="scanner-scan-area" aria-label="USB scanner input area"><div class="scanner-scan-icon" aria-hidden="true">[]</div><strong>Scan Student QR Code</strong><span>Waiting for scanner input</span></div>
      <div class="scanner-result hidden" id="scannerResult" role="alert" aria-live="assertive">
        <div class="scanner-result-title" id="scannerResultTitle"></div>
        <div class="scanner-student-name" id="scannerStudentName"></div>
        <div class="scanner-detail" id="scannerStudentId"></div>
        <div class="scanner-detail" id="scannerStudentClass"></div>
        <div class="scanner-detail" id="scannerSubject"></div>
        <div class="scanner-result-status" id="scannerResultStatus"></div>
        <div class="scanner-detail" id="scannerScannedAt"></div>
      </div>
    </section>
    <footer class="scanner-footer">Attendance is recorded for the current eligible schedule.</footer>
  </main>
  <script type="module" src="js/scanner.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EASPO — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-icon">
          <img src="logo.png" alt="">
        </div>
        <div>
          <div class="login-brand-name">EASPO</div>
          <div class="login-brand-sub">School Management</div>
        </div>
      </div>

      <h2>Welcome back</h2>
      <p class="sub">Sign in to your administrator account</p>

      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="login-field">
          <label for="email">Email Address</label>
          <input id="email" type="email" placeholder="admin@school.edu" required autocomplete="email" />
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
      </form>

      <button type="button" class="forgot-password-btn" id="forgotPasswordBtn" onclick="showForgotPassword()">
        Forgot password?
      </button>

      <form class="login-form hidden" id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">
        <div class="login-field">
          <label for="resetEmail">Email Address</label>
          <input id="resetEmail" type="email" placeholder="admin@school.edu" required autocomplete="email" />
        </div>
        <button type="submit" class="login-btn" id="resetBtn">Send Reset Link</button>
        <button type="button" class="login-back-btn" onclick="showLoginForm()">Back to Sign In</button>
      </form>

      <form class="login-form hidden" id="updatePasswordForm" onsubmit="handleUpdatePassword(event)">
        <div class="login-field">
          <label for="newPassword">New Password</label>
          <input id="newPassword" type="password" minlength="6" required autocomplete="new-password" />
        </div>
        <div class="login-field">
          <label for="confirmPassword">Confirm New Password</label>
          <input id="confirmPassword" type="password" minlength="6" required autocomplete="new-password" />
        </div>
        <button type="submit" class="login-btn" id="updatePasswordBtn">Update Password</button>
      </form>

      <div id="loginStatus"></div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>

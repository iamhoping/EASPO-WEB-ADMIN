services:
  - type: web
    name: easpo-full-restore
    runtime: docker
    plan: free
    dockerfilePath: ./restore-worker/Dockerfile
    dockerContext: ./restore-worker
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: BACKUP_SIGNING_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RESTORE_MAX_BYTES
        value: "104857600"
